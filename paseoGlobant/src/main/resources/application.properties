spring.application.name=PaseoAPP

spring.datasource.url=jdbc:h2:file:./bd_paseo
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Mensajes de error visibles para el front (error.response.data.message)
server.error.include-message=always

# JWT: cambiar el secreto en produccion (minimo 32 caracteres)
paseo.jwt.secreto=${PASEO_JWT_SECRETO:cambia-este-secreto-de-desarrollo-paseoapp-2026}
paseo.jwt.expiracion-minutos=120
