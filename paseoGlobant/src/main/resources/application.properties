spring.application.name=PaseoAPP

# PostgreSQL. Los valores por defecto sirven para correr el backend en local
# contra el contenedor de la base de datos (podman compose up -d db).
# En el compose se sobrescriben con SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD.
spring.datasource.url=jdbc:postgresql://localhost:5432/paseo
spring.datasource.username=paseo
spring.datasource.password=paseo

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Mensajes de error visibles para el front (error.response.data.message)
server.error.include-message=always

# JWT: cambiar el secreto en produccion (minimo 32 caracteres)
paseo.jwt.secreto=${PASEO_JWT_SECRETO:cambia-este-secreto-de-desarrollo-paseoapp-2026}
paseo.jwt.expiracion-minutos=120
