# Nginx dentro del contenedor del frontend
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Peticiones al API: se reenvian al contenedor "backend" (nombre del servicio en el compose)
    location /paseoapi/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos de Vite: llevan un hash en el nombre, se pueden cachear "para siempre"
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: cualquier ruta (/inicio, /admin/usuarios...) devuelve index.html
    # y el enrutador del navegador decide que pagina mostrar
    location / {
        try_files $uri $uri/ /index.html;
    }
}
